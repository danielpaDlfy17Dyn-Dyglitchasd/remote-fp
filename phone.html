<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Remote First-Person</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body { background: #000; color: #fff; font-family: "Segoe UI", system-ui, sans-serif; overflow: hidden; }

    /* ============ JOIN ============ */
    .screen { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; background: radial-gradient(120% 120% at 50% 20%, #0a0a0a 0%, #000 70%); }
    .brand { text-align: center; margin-bottom: 32px; }
    .brand .fp { font-size: 26px; font-weight: 800; letter-spacing: 5px; }
    .brand .sub { font-size: 12px; color: #999; letter-spacing: 3px; text-transform: uppercase; margin-top: 6px; }
    .panel { width: 100%; max-width: 360px; background: #0a0a0a; border: 1px solid #2a2a2a; border-radius: 14px; padding: 26px; }
    .panel h2 { font-size: 11px; letter-spacing: 3px; text-transform: uppercase; color: #999; font-weight: 600; margin-bottom: 20px; }
    .field { margin-bottom: 16px; }
    .field label { display: block; font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: #666; margin-bottom: 8px; }
    .field input { width: 100%; background: #121212; border: 1px solid #2a2a2a; color: #fff; padding: 13px 14px; border-radius: 8px; font-size: 17px; outline: none; letter-spacing: 3px; font-family: inherit; text-transform: uppercase; }
    .field input:focus { border-color: #4a4a4a; }
    .btn { width: 100%; padding: 15px; border: none; border-radius: 8px; cursor: pointer; font-size: 15px; font-weight: 700; letter-spacing: 3px; text-transform: uppercase; background: #fff; color: #000; transition: all .15s ease; }
    .btn.ghost { background: none; border: 1px solid #2a2a2a; color: #fff; margin-top: 8px; }
    .msg { margin-top: 14px; font-size: 13px; min-height: 18px; color: #666; text-align: center; }
    .msg.err { color: #ff5c5c; }

    /* ===== ÉBRESZTŐ KÉPERNYŐ ===== */
    #loadingScreen {
      min-height: 100vh; display: none; flex-direction: column;
      align-items: center; justify-content: center; gap: 18px; text-align: center;
      background: radial-gradient(120% 120% at 50% 20%, #0a0a0a 0%, #000 70%);
    }
    #loadingScreen.show { display: flex; }
    .spinner { width: 38px; height: 38px; border-radius: 50%; border: 3px solid #2a2a2a; border-top-color: #fff; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .load-title { font-size: 18px; font-weight: 700; letter-spacing: 3px; text-transform: uppercase; }
    .load-sub { font-size: 13px; color: #999; }

    /* ============ VEZÉRLŐPANEL (fullscreen kamera) ============ */
    #view { display: none; position: fixed; inset: 0; background: #000; }
    .preview video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }

    .panel-wrap {
      position: absolute; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 12px;
      padding: 14px; pointer-events: none;
    }

    /* Felső indikátor */
    .topbar { display: flex; align-items: center; gap: 8px; padding: 6px 16px; border: 1px solid rgba(255,255,255,.25); border-radius: 30px; background: rgba(0,0,0,.5); backdrop-filter: blur(4px); }
    .topbar .led { width: 8px; height: 8px; border-radius: 50%; background: #666; }
    .topbar .led.on { background: #fff; box-shadow: 0 0 10px rgba(255,255,255,.5); }
    .topbar .txt { font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: #999; }

    /* Fő sor: 3 oszlop */
    .main-row { display: flex; gap: 14px; align-items: stretch; width: 100%; }

    /* Bal: billentyűk */
    .col-keys { display: flex; flex-direction: column; gap: 8px; justify-content: center; }
    .row { display: flex; gap: 6px; justify-content: center; }
    .key {
      display: flex; align-items: center; justify-content: center;
      width: 42px; height: 42px; border-radius: 8px; font-size: 15px; font-weight: 700;
      background: rgba(0,0,0,.5); border: 1px solid rgba(255,255,255,.3); color: rgba(255,255,255,.75);
      backdrop-filter: blur(4px); transition: all .06s ease;
    }
    .key.small { width: 38px; height: 34px; font-size: 13px; }
    .key.dim { color: rgba(255,255,255,.5); }
    .key.long { width: 62px; height: 30px; font-size: 11px; letter-spacing: 1px; }
    .key.on { background: #fff; color: #000; border-color: #fff; box-shadow: 0 0 16px rgba(255,255,255,.5); }
    .key.on.dim { color: #000; }

    /* Közép: egérmozgás-indikátor + kamera preview */
    .col-center { flex: 1; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
    .mouse-track {
      position: relative; height: 46px; flex-shrink: 0;
      border: 1px solid rgba(255,255,255,.2); border-radius: 10px;
      background: rgba(0,0,0,.4); backdrop-filter: blur(4px); overflow: hidden;
    }
    .mouse-track .dot {
      position: absolute; top: 50%; left: 50%;
      width: 10px; height: 10px; border-radius: 50%;
      background: #fff; box-shadow: 0 0 10px rgba(255,255,255,.6);
      transform: translate(-50%, -50%);
    }
    .mouse-track .dot.snap { transition: transform .12s ease-out; }
    .preview {
      position: relative; flex: 1; border-radius: 12px; overflow: hidden;
      border: 1px solid rgba(255,255,255,.2); min-height: 180px; background: rgba(0,0,0,.3);
    }

    /* Jobb: egérgombok */
    .col-mouse { display: flex; flex-direction: column; gap: 10px; justify-content: center; }
    .mouse-btn { width: 52px; height: 60px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; border-radius: 10px; background: rgba(0,0,0,.5); border: 1px solid rgba(255,255,255,.3); color: rgba(255,255,255,.7); font-size: 9px; letter-spacing: 1px; backdrop-filter: blur(4px); transition: all .06s ease; }
    .mouse-btn svg { width: 20px; height: 20px; fill: currentColor; }
    .mouse-btn.on { background: #fff; color: #000; border-color: #fff; box-shadow: 0 0 16px rgba(255,255,255,.5); }
  </style>
</head>
<body>

  <!-- ========== JOIN ========== -->
  <div class="screen" id="joinScreen">
    <div class="brand"><div class="fp">REMOTE FP</div><div class="sub">Csatlakozás</div></div>
    <div class="panel" id="joinPanel">
      <div id="phaseChoice">
        <button class="btn" id="joinRoomBtn">Join Room</button>
        <div class="msg">Kérj a gépről egy szobakódot és jelszót.</div>
      </div>
    </div>
  </div>

  <!-- ========== ÉBRESZTŐ KÉPERNYŐ ========== -->
  <div id="loadingScreen">
    <div class="spinner"></div>
    <div class="load-title" id="loadTitle">Szerver ébresztése...</div>
    <div class="load-sub">Az első csatlakozás akár 1 percig is eltarthat</div>
  </div>

  <!-- ========== VEZÉRLŐPANEL ========== -->
  <div id="view">
    <div class="panel-wrap">
      <div class="topbar"><span class="led" id="led"></span><span class="txt" id="connTxt">Kapcsolódás</span></div>

      <div class="main-row">
        <!-- Bal: billentyűk -->
        <div class="col-keys">
          <div class="row">
            <div class="key small" id="kR">R</div>
            <div class="key small" id="kF">F</div>
          </div>
          <div class="row">
            <div class="key" id="kQ">Q</div>
            <div class="key" id="kUp">↑</div>
            <div class="key" id="kE">E</div>
          </div>
          <div class="row">
            <div class="key dim" id="kL">←</div>
            <div class="key dim" id="kC">●</div>
            <div class="key dim" id="kRg">→</div>
          </div>
          <div class="row">
            <div class="key" id="kDn">↓</div>
          </div>
          <div class="row">
            <div class="key long" id="kCtrl">CTRL</div>
            <div class="key long" id="kShift">Shift</div>
          </div>
        </div>

        <!-- Közép: egérmozgás-indikátor + kamera preview -->
        <div class="col-center">
          <div class="mouse-track"><div class="dot" id="mouseDot"></div></div>
          <div class="preview"><video id="preview" autoplay playsinline muted></video></div>
        </div>

        <!-- Jobb: egérgombok -->
        <div class="col-mouse">
          <div class="mouse-btn" id="mLmb">
            <svg viewBox="0 0 24 24"><path d="M12 2a5 5 0 0 0-5 5v6a5 5 0 0 0 10 0V7a5 5 0 0 0-5-5zm0 2a3 3 0 0 1 3 3h-2V8h-2V7a3 3 0 0 1 1-2z"/></svg>
            LMB
          </div>
          <div class="mouse-btn" id="mRmb">
            <svg viewBox="0 0 24 24"><path d="M12 2a5 5 0 0 0-5 5v6a5 5 0 0 0 10 0V7a5 5 0 0 0-5-5zm3 8h-2v1h-2v-1H9V7a3 3 0 0 1 6 0z"/></svg>
            RMB
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);
    const joinScreen = $("joinScreen"), viewEl = $("view");
    const joinPanel = $("joinPanel");
    const video = $("preview"), mouseDot = $("mouseDot");
    const connTxt = $("connTxt"), led = $("led");

    // ----- Egérmozgás-indikátor (kis pont, ami az egér irányába mozdul) -----
    let dotX = 0, dotY = 0, lastMove = 0;
    const MAXR = 70;
    function moveDot(dx, dy) {
      if (!dx && !dy) return;
      dotX = Math.max(-MAXR, Math.min(MAXR, dotX + dx));
      dotY = Math.max(-MAXR, Math.min(MAXR, dotY + dy));
      lastMove = performance.now();
      mouseDot.classList.remove("snap");
      mouseDot.style.transform = `translate(calc(-50% + ${dotX}px), calc(-50% + ${dotY}px))`;
    }
    setInterval(() => {
      // ~0,5 mp jelentős mozgás nélkül visszaugrik középre
      if (lastMove && performance.now() - lastMove > 500) {
        dotX = 0; dotY = 0; lastMove = 0;
        mouseDot.classList.add("snap");
        mouseDot.style.transform = "translate(-50%, -50%)";
      }
    }, 100);

    let ws = null;
    let entered = { code: "", pass: "" };

    $("joinRoomBtn").addEventListener("click", () => {
      showForm("code", "Szobakód (A-Z, min 5)", (val) => {
        if (!/^[A-Z]{5,}$/.test(val)) { $("formMsg").textContent = "Min. 5 betű, csak A-Z."; return; }
        entered.code = val;
        showForm("pass", "Jelszó (számok)", (v2) => {
          if (!/^[0-9]{3,}$/.test(v2)) { $("formMsg").textContent = "Min. 3 szám, csak számok."; return; }
          entered.pass = v2; doJoin();
        });
      });
    });

    function showForm(title, ph, cb) {
      joinPanel.innerHTML = `
        <h2>${title}</h2>
        <div class="field"><input id="formInput" placeholder="${ph}" maxlength="12" autocomplete="off" /></div>
        <button class="btn" id="formNext">Tovább</button>
        <button class="btn ghost" id="formBack">Vissza</button>
        <div class="msg" id="formMsg"></div>`;
      $("formInput").addEventListener("input", (e) => {
        e.target.value = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 12);
      });
      $("formNext").addEventListener("click", () => {
        const v = $("formInput").value.trim();
        if (!v) { $("formMsg").textContent = "Adj meg értéket."; return; }
        cb(v);
      });
      $("formBack").addEventListener("click", () => { if (title.startsWith("Jelszó")) showCodeAgain(); else location.reload(); });
      $("formInput").focus();
    }
    function showCodeAgain() { $("joinRoomBtn").click(); }

    function doJoin() {
      joinScreen.style.display = "none";
      $("loadingScreen").classList.add("show");
      const proto = location.protocol === "https:" ? "wss" : "ws";
      tryJoin(proto);
    }
    function tryJoin(proto) {
      ws = new WebSocket(`${proto}://${location.host}`);
      let opened = false;
      ws.onopen = () => { opened = true; send({ type: "join-room", payload: { code: entered.code, pass: entered.pass } }); };
      ws.onmessage = (e) => handleServer(JSON.parse(e.data));
      ws.onclose = () => { if (!opened) setTimeout(() => tryJoin(proto), 4000); };
      ws.onerror = () => {};
    }
    function send(obj) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(obj)); }

    function handleServer(data) {
      switch (data.type) {
        case "room-ok": startStream(); break;
        case "room-error": {
          $("loadingScreen").classList.remove("show");
          joinScreen.style.display = "flex";
          joinPanel.innerHTML = `<h2>Hiba</h2><div class="msg err" id="errMsg"></div><button class="btn" id="retryBtn" style="margin-top:14px">Újra</button>`;
          $("errMsg").textContent = data.payload;
          $("retryBtn").addEventListener("click", () => location.reload());
          break;
        }
        case "peer-left": connTxt.textContent = "A gép leállt"; led.classList.remove("on"); break;
        case "signal": { const s = data.payload; if (s.to !== "phone") return; handleSignal(s); break; }
      }
    }

    // ----- WebRTC -----
    const pc = new RTCPeerConnection({ iceServers: [{ urls: "stun:stun.l.google.com:19302" }] });
    let remoteSet = false;
    let pendingCandidates = [];
    pc.onicecandidate = (e) => { if (e.candidate) send({ type: "signal", payload: { to: "pc", ice: e.candidate } }); };
    pc.ondatachannel = (e) => {
      const ch = e.channel;
      ch.onopen = () => { led.classList.add("on"); connTxt.textContent = "Kapcsolódva"; };
      ch.onmessage = (m) => {
        try { const cmd = JSON.parse(m.data); if (cmd.type === "state") handleState(cmd); } catch (err) {}
      };
    };

    function handleSignal(s) {
      if (s.sdp && s.sdp.type === "answer") {
        // A PC válasza -> most kapcsolódik össze a WebRTC
        pc.setRemoteDescription(s.sdp).then(() => {
          remoteSet = true;
          for (const c of pendingCandidates) pc.addIceCandidate(c).catch(() => {});
          pendingCandidates = [];
        }).catch(() => {});
      } else if (s.ice) {
        if (remoteSet) pc.addIceCandidate(s.ice).catch(() => {});
        else pendingCandidates.push(s.ice); // még korán érkezett -> sorba
      }
    }

    async function startStream() {
      viewEl.style.display = "block";
      joinScreen.style.display = "none";
      connTxt.textContent = "Kamera indítása...";
      let stream;
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: "environment" }, width: { ideal: 1280 } }, audio: false
        });
        video.srcObject = stream;
      } catch (err) { connTxt.textContent = "Kamera hiba: " + err.name + " (https kell)"; return; }
      stream.getTracks().forEach((t) => pc.addTrack(t, stream));

      // Adatcsatorna az offer ELŐTT (így bekerül az SDP-be és tényleg megnyílik)
      const dc = pc.createDataChannel("control");
      dc.onopen = () => { led.classList.add("on"); connTxt.textContent = "Kapcsolódva"; };
      dc.onmessage = (m) => {
        try { const cmd = JSON.parse(m.data); if (cmd.type === "state") handleState(cmd); } catch (err) {}
      };

      const offer = await pc.createOffer();
      await pc.setLocalDescription(offer);
      send({ type: "signal", payload: { to: "pc", sdp: pc.localDescription } });
      connTxt.textContent = "Kapcsolódás...";
    }

    // ----- Parancs kijelzés: a PC gombjai világítanak -----
    function handleState(cmd) {
      const h = cmd.held || {};
      const tg = cmd.toggles || {};

      // mozgásgombok (WASD vagy nyilak a PC-n)
      $("kUp").classList.toggle("on", !!h.forward);
      $("kDn").classList.toggle("on", !!h.back);
      $("kL").classList.toggle("on", !!h.left);
      $("kRg").classList.toggle("on", !!h.right);

      // Q/E/R
      $("kQ").classList.toggle("on", !!h.rotL);
      $("kE").classList.toggle("on", !!h.rotR);
      $("kR").classList.toggle("on", !!h.act);

      // toggles: F, CTRL, Shift
      $("kF").classList.toggle("on", !!tg.F);
      $("kCtrl").classList.toggle("on", !!tg.CTRL);
      $("kShift").classList.toggle("on", !!tg.SHIFT);

      // egérgombok
      $("mLmb").classList.toggle("on", !!h.LMB);
      $("mRmb").classList.toggle("on", !!h.RMB);

      // egérmozgás-indikátor
      if (cmd.look) moveDot(cmd.look.dx, cmd.look.dy);
    }
  </script>
</body>
</html>
